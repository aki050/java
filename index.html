<!DOCTYPE html>
<html lang="ja"> 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おみくじWebアプリ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      max-width: 500px;
      margin: auto;
    }
    label, button, p {
      display: block;
      margin: 0.8rem 0;
    }
    .result {
      margin-top: 1.2rem;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .result.show {
      opacity: 1;
      transform: translateY(0);
    }
    .daikichi { color: #2e7d32; }
    .chukichi { color: #1e88e5; }
    .shokichi { color: #ff8f00; }
    .kyou { color: #c62828; }
    .history {
      margin-top: 2rem;
      padding: 1rem;
      border: 1px solid #dde4eb;
      border-radius: 8px;
      background: #fff;
      font-size: 0.9rem;
      color: #555;
    }
    .history strong {
      display: block;
      margin-bottom: 0.8rem;
      color: #333;
    }
    .history p {
      margin: 0.4rem 0;
      padding: 0.3rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .history p:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <h1>おみくじWebアプリ</h1>
  <label>お名前
    <input id="name" type="text" placeholder="名前を入力" required maxlength="20" aria-label="名前入力" />
  </label>
  <button id="draw">おみくじを引く</button>
  <div class="result" id="result" role="status" aria-live="polite">結果がここに表示されます</div>
  <div class="history">
    <strong>引いた履歴</strong>
    <div id="historyList">まだ引いていません</div>
  </div>

  <script>
    const items = ["桜", "バスケットボール", "時計", "猫", "本"];
    const drawButton = document.getElementById('draw');
    const nameField = document.getElementById('name');
    const resultDiv = document.getElementById('result');
    const historyList = document.getElementById('historyList');

    function getOmikuji() {
      const rand = Math.floor(Math.random() * 20);
      if (rand === 0) return '大吉';
      if (rand <= 4) return '中吉';
      if (rand <= 11) return '小吉';
      return '凶';
    }

    function getLuckyItem() {
      return items[Math.floor(Math.random() * items.length)];
    }

    function showResult(name, omikuji, luckyItem) {
      resultDiv.className = `result ${omikuji === '大吉' ? 'daikichi' : omikuji === '中吉' ? 'chukichi' : omikuji === '小吉' ? 'shokichi' : 'kyou'}`;
      resultDiv.textContent = `${name}さんの結果: ${omikuji} (ラッキーアイテム: ${luckyItem})`;
      setTimeout(() => resultDiv.classList.add('show'), 10);
      addHistory(name, omikuji, luckyItem);
    }

    function showError(message) {
      resultDiv.className = 'result show';
      resultDiv.style.color = 'red';
      resultDiv.textContent = message;
    }

    function addHistory(name, omikuji, item) {
      const p = document.createElement('p');
      const now = new Date().toLocaleString('ja-JP', { hour12: false });
      p.textContent = `${now} - ${name}さん: ${omikuji} (${item})`;
      historyList.insertBefore(p, historyList.firstChild);
      if (historyList.childElementCount > 7) {
        historyList.removeChild(historyList.lastChild);
      }
    }

    drawButton.addEventListener('click', () => {
      const name = nameField.value.trim();
      if (!name) {
        showError('名前を入力してください');
        nameField.focus();
        return;
      }
      if (name.length > 20) {
        showError('名前は20文字以内で入力してください');
        nameField.focus();
        return;
      }

      const omikuji = getOmikuji();
      const luckyItem = getLuckyItem();
      showResult(name, omikuji, luckyItem);
    });
  </script>
</body>
</html>
