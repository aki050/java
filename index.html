<!DOCTYPE html>
<html lang="ja"> 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おみくじWebアプリ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      max-width: 500px;
      margin: auto;
    }
    label, button, p {
      display: block;
      margin: 0.8rem 0;
    }
    .result {
      margin-top: 1.2rem;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .daikichi { color: #2e7d32; }
    .chukichi { color: #1e88e5; }
    .shokichi { color: #ff8f00; }
    .kyou { color: #c62828; }
  </style>
</head>
<body>
  <h1>おみくじWebアプリ</h1>
  <label>お名前
    <input id="name" type="text" placeholder="名前を入力" />
  </label>
  <button id="draw">おみくじを引く</button>
  <div class="result" id="result">結果がここに表示されます</div>

  <script>
    const items = ["桜", "バスケットボール", "時計", "猫", "本"];
    const drawButton = document.getElementById('draw');
    const nameField = document.getElementById('name');
    const resultDiv = document.getElementById('result');

    function getOmikuji() {
      const rand = Math.floor(Math.random() * 20);
      if (rand === 0) return '大吉';
      if (rand <= 4) return '中吉';
      if (rand <= 11) return '小吉';
      return '凶';
    }

    function getLuckyItem() {
      return iteclassName = `result ${omikuji === '大吉' ? 'daikichi' : omikuji === '中吉' ? 'chukichi' : omikuji === '小吉' ? 'shokichi' : 'kyou'}`om() * items.length)];
    }

    function showResult(name, omikuji, luckyItem) {
      resultDiv.style.color = 'inherit';
      resultDiv.textContent = `${name}さんの結果: ${omikuji} (ラッキーアイテム: ${luckyItem})`;
    }

    function showError(message) {
      resultDiv.className = 'result';
      resultDiv.style.color = 'red';
      resultDiv.textContent = message;
    }

    drawButton.addEventListener('click', () => {
      const name = nameField.value.trim();
      if (!name) {
        showError('名前を入力してください');
        return;
      }

      const omikuji = getOmikuji();
      const luckyItem = getLuckyItem();
      showResult(name, omikuji, luckyItem);
    });
  </script>
</body>
</html>
