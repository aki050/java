<!DOCTYPE html>
<html lang="ja"> 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おみくじWebアプリ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      max-width: 500px;
      margin: auto;
    }
    label, button, p {
      display: block;
      margin: 0.8rem 0;
    }
    .result {
      margin-top: 1.2rem;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>おみくじWebアプリ</h1>
  <label>お名前
    <input id="name" type="text" placeholder="名前を入力" />
  </label>
  <button id="draw">おみくじを引く</button>
  <div class="result" id="result">結果がここに表示されます</div>

  <script>
    const items = ["桜", "バスケットボール", "時計", "猫", "本"];
    const drawButton = document.getElementById('draw');
    const nameField = document.getElementById('name');
    const resultDiv = document.getElementById('result');

    drawButton.addEventListener('click', () => {
      const name = nameField.value.trim();
      if (!name) {
        resultDiv.textContent = '名前を入力してください';
        resultDiv.style.color = 'red';
        return;
      }

      const rand = Math.floor(Math.random() * 20);
      let omikuji;
      if (rand === 0) {
        omikuji = '大吉';
      } else if (rand <= 4) {
        omikuji = '中吉';
      } else if (rand <= 11) {
        omikuji = '小吉';
      } else {
        omikuji = '凶';
      }

      const luckyItem = items[Math.floor(Math.random() * items.length)];
      resultDiv.style.color = 'inherit';
      resultDiv.textContent = `${name}さんの結果: ${omikuji} (ラッキーアイテム: ${luckyItem})`;
    });
  </script>
</body>
</html>
